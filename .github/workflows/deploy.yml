name: Deploy DevOps Site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # Mise à jour quotidienne

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Generate Site
        run: |
          chmod +x generate_site.py
          ./generate_site.py || exit 1
          curl -sL https://favicon.ico -o favicon.ico || true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
