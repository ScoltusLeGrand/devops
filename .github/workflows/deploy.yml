name: Deploy DevOps Site

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Generate files
        run: |
          python generate_site.py || exit 1
          curl -f -L https://favicon.ico -o favicon.ico || exit 0

      - name: Verify files
        run: |
          [ -f index.html ] || (echo "index.html manquant" && exit 1)
          echo "Fichiers générés :"
          ls -l

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
