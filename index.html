<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet DevOps</title>
    
    <!-- Favicon minimaliste -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <style>
        :root {
            --orange-devops: #E67E22;  /* Orange foncé moderne */
            --noir: #2C3E50;
            --blanc: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #FDF2E9;  /* Fond légèrement orangé */
            color: var(--noir);
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            background: var(--blanc);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid var(--orange-devops);
        }
        h1 {
            color: var(--orange-devops);
            margin-bottom: 25px;
            font-weight: 600;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        .signature {
            color: var(--orange-devops);
            font-weight: bold;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bonjour le Monde !</h1>
        <p>Ce site est déployé automatiquement avec GitHub Actions.</p>
        <p class="signature">Mini Projet DevOps présenté par Bernard Thibaut</p>
         <p class="signature">Encadré par Mor Firas</p>
    </div>
</body>
</html>
